# Publishes both packages to npm with npm trusted publishing (OIDC): no npm
# token is stored anywhere. npm allows one trusted publisher per package, so
# this one workflow handles both paths:
#
# - A semver tag (`vX.Y.Z`) cuts a real release: full gate suite, verify the
#   tag matches package.json and SDK_VERSION, publish both packages to
#   `latest`, then create the GitHub Release.
# - Every push to `development` publishes a prerelease to the `next` dist-tag
#   as `<package.json version>-dev.<short-sha>` (never committed back).
#
# Trusted publisher on npmjs.com, for @codeskop/tracker and
# @codeskop/tracker-react: GitHub Actions, Codeskop-io / web-sdk, workflow
# `release.yml`, no environment. Trusted publishing needs npm >= 11.5.1 and a
# GitHub-hosted runner (see docs/10-publishing-setup.md).
name: Release (production)

on:
  push:
    tags: ["v*"]
    branches: [development]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    name: Gate, then publish ('latest' on a tag, 'next' on development)
    runs-on: ubuntu-latest
    steps:
      # `on: push: tags` checks out the tagged commit — the release is built
      # from exactly what was tagged, never a branch tip.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (root + workspaces)
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck (core)
        run: npm run typecheck

      - name: Test + coverage gate (core)
        run: npm test

      # Core must be built before anything react-adapter-side runs — see the
      # matching comment in ci.yml (the react workspace resolves
      # `@codeskop/tracker` via a workspace symlink to the repo root, whose
      # `exports`/`types` point at `dist/`, not `src/`).
      - name: Build (core)
        run: npm run build

      - name: Typecheck (react adapter)
        run: npm run typecheck --workspace=@codeskop/tracker-react

      - name: Test + coverage gate (react adapter)
        run: npm run test --workspace=@codeskop/tracker-react

      - name: Build (react adapter)
        run: npm run build --workspace=@codeskop/tracker-react

      - name: API report check (core + react adapter)
        run: npm run api:check:all

      - name: Bundle-size budget (core)
        run: npm run size

      - name: Bundle-size budget (react adapter)
        run: npm run size --workspace=@codeskop/tracker-react

      - name: Playwright e2e (vs mock ingest server)
        run: npx playwright test

      # The one manual step before tagging is bumping package.json's version
      # (core) and `src/core/version.ts`'s `SDK_VERSION` literal (which mirrors
      # *core's* package.json specifically, per that file's own doc comment)
      # to match — this fails the release loudly instead of shipping a
      # tag/package mismatch or a stale telemetry version if that step was
      # missed or done incompletely. The tag names the overall SDK release and
      # is authoritative for **core's** version; the react adapter is
      # versioned independently (`docs/07-semver-policy.md` §7.1 — separate
      # package, separate SemVer line, only a wide `peerDependencies` range
      # ties them together), so a react/package.json version that differs
      # from the tag is expected in that model and only warned about, not
      # failed.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core_version="$(node -p "require('./package.json').version")"
          react_version="$(node -p "require('./react/package.json').version")"

          fail=0
          if [ "$tag" != "$core_version" ]; then
            echo "::error::Tag v$tag does not match package.json version $core_version. Bump package.json to $tag before tagging. See publish-workflow.md."
            fail=1
          fi

          sdk_version_literal="$(grep -o "SDK_VERSION = '[^']*'" src/core/version.ts | sed "s/SDK_VERSION = '//;s/'//")"
          if [ "$tag" != "$sdk_version_literal" ]; then
            echo "::error::Tag v$tag does not match src/core/version.ts's SDK_VERSION literal ($sdk_version_literal). Bump SDK_VERSION to $tag in the same commit as package.json. See publish-workflow.md."
            fail=1
          fi

          if [ "$tag" != "$react_version" ]; then
            echo "::warning::react/package.json version ($react_version) differs from tag v$tag — expected if the react adapter's independent SemVer line (docs/07-semver-policy.md §7.1) hasn't moved this release; it will still publish at its own current version $react_version."
          fi

          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "Tag v$tag matches package.json and SDK_VERSION."

      # Computed here, not read from a prior step's mutated package.json —
      # the version bump below happens in this same job, after every gate has
      # already passed against the *real* package.json version.
      - name: Compute prerelease version
        if: github.ref == 'refs/heads/development'
        id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          sha="$(git rev-parse --short HEAD)"
          version="${base}-dev.${sha}"
          echo "Computed prerelease version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Rewrites just the `version` field in-place in both package.json files
      # for this publish only — never committed back to `development`.
      - name: Stamp prerelease version (core + react adapter)
        if: github.ref == 'refs/heads/development'
        env:
          DEV_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            for (const p of ['package.json', 'react/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = process.env.DEV_VERSION;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Choose the npm dist-tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "DIST_TAG=latest" >> "$GITHUB_ENV"; else echo "DIST_TAG=next" >> "$GITHUB_ENV"; fi

      - name: Publish core
        run: npm publish --tag "$DIST_TAG" --access public --provenance

      - name: Publish react adapter
        run: npm publish --workspace=@codeskop/tracker-react --tag "$DIST_TAG" --access public --provenance

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
